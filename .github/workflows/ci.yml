name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: hivebox-python
        run: uv sync --frozen

      - name: Run pylint
        working-directory: hivebox-python
        run: uv run pylint app/ main.py

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: hivebox:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests in Docker
        run: docker run --rm hivebox:test

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: hivebox:prod
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container for integration tests
        run: docker run -d --name hivebox-test -p 8000:80 hivebox:prod

      - name: Wait for container to be ready
        run: sleep 5

      - name: Test /version endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8000/version)
          echo "Response: $RESPONSE"
          VERSION=$(echo $RESPONSE | jq -r '.version')
          echo "Version from API: $VERSION"
          if [ "$VERSION" != "0.2.0" ]; then
            echo "ERROR: Expected version 0.2.0, got $VERSION"
            exit 1
          fi
          echo "✓ Version endpoint returns correct value: $VERSION"

      - name: Stop container
        if: always()
        run: docker stop hivebox-test && docker rm hivebox-test
